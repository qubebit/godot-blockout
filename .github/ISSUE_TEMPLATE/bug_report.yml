name: Bug report
description: Report a bug with Blockout
body:
  - type: markdown
    attributes:
      value: |
        - Write a descriptive issue title above.
        - Search [open](https://github.com/qubebit/godot-blockout/issues) and [closed](https://github.com/qubebit/godot-blockout/issues?q=is%3Aissue+is%3Aclosed) issues to ensure it has not already been reported.

  - type: input
    attributes:
      label: Blockout version
      description: >
        Specify the version of the addon (e.g. from plugin.cfg or the release tag).
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    attributes:
      label: Godot version
      description: >
        Specify the Godot version you are using.
      placeholder: v4.3.stable.official
    validations:
      required: true

  - type: input
    attributes:
      label: System information
      description: |
        Specify the OS and architecture.
      placeholder: macOS 15.0 (arm64)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Issue description
      description: |
        Describe your issue briefly. What doesn't work, and how do you expect it to work instead?
        You can include images or videos with drag and drop, and format code blocks or logs with <code>```</code> tags.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        List the steps to reproduce the issue.
    validations:
      required: true
